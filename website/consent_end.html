<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thank You</title>
    <style>
        body{font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg,#eef2ff 0%,#e0e7ff 100%); margin:0; display:flex; align-items:center; justify-content:center; min-height:100vh}
        .panel{background:white;padding:28px;border-radius:10px;box-shadow:0 10px 30px rgba(2,6,23,0.12);max-width:720px;text-align:center}
        h1{margin:0 0 8px;font-size:1.4rem}
        p{color:#374151}
        .btn{margin-top:18px;padding:10px 18px;border-radius:8px;border:none;background:#4f46e5;color:white;cursor:pointer}
        
        /* Language Switcher - Fixed Top Right */
        .language-switcher {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10000;
            background: white;
            border-radius: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }
        
        .language-switcher:hover {
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
            transform: translateY(-2px);
        }
        
        .language-switcher .lang-icon {
            font-size: 20px;
        }
        
        .language-switcher select {
            border: none;
            background: transparent;
            font-size: 14px;
            font-weight: bold;
            color: #333;
            cursor: pointer;
            outline: none;
            padding: 4px 8px;
            border-radius: 4px;
            transition: background 0.2s;
        }
        
        .language-switcher select:hover {
            background: #f0f0f0;
        }
        
        .language-switcher select option {
            padding: 8px;
        }
    </style>
</head>
<body>
    <!-- Language Switcher -->
    <div class="language-switcher">
        <span class="lang-icon">🌐</span>
        <select id="languageSelect" onchange="switchLanguage(this.value)">
            <option value="en" selected>English</option>
            <option value="zh">中文</option>
        </select>
    </div>

    <div class="panel">
        <h1 data-i18n="end.title">Thank you for your time</h1>
        <p data-i18n="end.message">Your preference has been recorded. You chose not to participate in this study. If you have any questions, please contact the research team at <span style="color:#111827;font-weight:600">crq2020_08@mail.ustc.edu.cn</span>.</p>
    </div>
    
    <script>
        // ========================================
        // Internationalization (i18n) System
        // ========================================
        
        const API_BASE = 'https://arcana-api.arcanacogtest.workers.dev'

        const translations = {
            en: {
                end: {
                    title: "Thank you for your time",
                    message: "Your preference has been recorded. You chose not to participate in this study. If you have any questions, please contact the research team at "
                }
            },
            zh: {
                end: {
                    title: "感谢您的时间",
                    message: "您的选择已记录。您选择不参与本研究。如有任何问题，请联系研究团队："
                }
            }
        };
        
        let currentLanguage = 'en';
        
        function switchLanguage(lang) {
            if (!translations[lang]) {
                console.warn(`Language ${lang} not found, defaulting to English`);
                lang = 'en';
            }
            
            currentLanguage = lang;
            localStorage.setItem('preferredLanguage', lang);
            
            document.querySelectorAll('[data-i18n]').forEach(element => {
                const key = element.getAttribute('data-i18n');
                const translation = getTranslation(key, lang);
                if (translation) {
                    // Preserve the email span for the message
                    if (key === 'end.message') {
                        element.innerHTML = translation + '<span style="color:#111827;font-weight:600">crq2020_08@mail.ustc.edu.cn</span>.';
                    } else {
                        element.innerHTML = translation;
                    }
                }
            });
            
            console.log(`Language switched to: ${lang}`);
        }
        
        function getTranslation(keyPath, lang = currentLanguage) {
            const keys = keyPath.split('.');
            let value = translations[lang];
            
            for (const key of keys) {
                if (value && typeof value === 'object') {
                    value = value[key];
                } else {
                    return null;
                }
            }
            
            return value || translations.en[keyPath];
        }
        
        function initializeLanguage() {
            const savedLang = localStorage.getItem('preferredLanguage');
            if (savedLang && translations[savedLang]) {
                currentLanguage = savedLang;
                const languageSelect = document.getElementById('languageSelect');
                if (languageSelect) {
                    languageSelect.value = savedLang;
                }
                switchLanguage(savedLang);
            } else {
                // Default to English if no saved preference
                switchLanguage('en');
            }
        }
        
        // Initialize language on page load
        window.addEventListener('DOMContentLoaded', initializeLanguage);
        
        // ========================================
        // End of i18n System
        // ========================================
    </script>
</body>
</html>
